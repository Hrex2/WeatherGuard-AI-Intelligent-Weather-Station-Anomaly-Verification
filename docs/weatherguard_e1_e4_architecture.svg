<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="700" viewBox="0 0 1380 700" role="img" aria-labelledby="title desc">
  <title id="title">WeatherGuard E1–E4 evidence integration architecture</title>
  <desc id="desc">Saved observations and baseline artifacts feed four evidence adapters. E3 remains descriptive only and is not decision eligible. The integration engine validates outputs and produces a conservative explanation for the dashboard.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#60a5fa"/></marker>
    <style>
      .title{font:700 27px Inter,Segoe UI,sans-serif;fill:#f1f5f9}.subtitle{font:14px Inter,Segoe UI,sans-serif;fill:#94a3b8}
      .node{fill:#172438;stroke:#35516f;stroke-width:1.5;rx:13}.adapter{fill:#132d40;stroke:#38bdf8;stroke-width:1.5;rx:12}
      .restricted{fill:#332b18;stroke:#fbbf24;stroke-width:1.5;rx:12}.engine{fill:#172b39;stroke:#2dd4bf;stroke-width:2;rx:16}
      .out{fill:#202b3a;stroke:#94a3b8;stroke-width:1.5;rx:13}.heading{font:650 16px Inter,Segoe UI,sans-serif;fill:#e2e8f0}
      .body{font:12px Inter,Segoe UI,sans-serif;fill:#a9b8ca}.tag{font:700 10px Inter,Segoe UI,sans-serif;letter-spacing:1px;fill:#67e8f9}
      .warn{font:650 11px Inter,Segoe UI,sans-serif;fill:#fcd34d}.line{fill:none;stroke:#60a5fa;stroke-width:2;marker-end:url(#arrow)}
      .mutedline{fill:none;stroke:#fbbf24;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1380" height="700" fill="url(#bg)"/>
  <text x="40" y="48" class="title">WeatherGuard AI · E1–E4 evidence integration</text>
  <text x="40" y="74" class="subtitle">Saved baseline outputs and existing evidence screens → validated schema → conservative, explainable triage</text>

  <rect x="40" y="120" width="260" height="105" class="node"/>
  <text x="60" y="151" class="tag">INPUT</text><text x="60" y="179" class="heading">VILD0 observations</text>
  <text x="60" y="201" class="body">Verified processed historical series</text>
  <rect x="40" y="290" width="260" height="110" class="node"/>
  <text x="60" y="321" class="tag">BASELINE ARTIFACT</text><text x="60" y="350" class="heading">Saved Phase 03 outputs</text>
  <text x="60" y="373" class="body">12 configuration predictions · unchanged</text>
  <rect x="40" y="490" width="260" height="110" class="node"/>
  <text x="60" y="521" class="tag">RESTRICTED CONTEXT</text><text x="60" y="550" class="heading">Spatial comparisons</text>
  <text x="60" y="573" class="body">Exploratory rows; provenance unresolved</text>

  <rect x="380" y="95" width="265" height="94" class="adapter"/>
  <text x="400" y="124" class="tag">E1</text><text x="400" y="151" class="heading">Model stability</text>
  <text x="400" y="172" class="body">Existing saved 8/12 candidate screen</text>
  <rect x="380" y="225" width="265" height="94" class="adapter"/>
  <text x="400" y="254" class="tag">E2</text><text x="400" y="281" class="heading">Temporal consistency</text>
  <text x="400" y="302" class="body">Prior-only temporal screening</text>
  <rect x="380" y="355" width="265" height="104" class="restricted"/>
  <text x="400" y="384" class="warn">E3 · DESCRIPTIVE ONLY</text><text x="400" y="411" class="heading">Spatial comparison adapter</text>
  <text x="400" y="434" class="body">Decision eligibility: false</text>
  <rect x="380" y="495" width="265" height="94" class="adapter"/>
  <text x="400" y="524" class="tag">E4</text><text x="400" y="551" class="heading">Physical plausibility</text>
  <text x="400" y="572" class="body">Broad screening rules</text>

  <rect x="720" y="225" width="300" height="235" class="engine"/>
  <text x="745" y="258" class="tag">INTEGRATION ENGINE</text>
  <text x="745" y="292" class="heading">Validate component records</text>
  <text x="745" y="323" class="body">Availability · conflicts · limitations</text>
  <text x="745" y="351" class="body">Preserve baseline · no voting or weights</text>
  <text x="745" y="390" class="warn">No validated combined classifier</text>
  <text x="745" y="422" class="body">Missing evidence ≠ normal evidence</text>

  <rect x="1090" y="260" width="245" height="165" class="out"/>
  <text x="1112" y="292" class="tag">DASHBOARD</text>
  <text x="1112" y="322" class="heading">Evidence breakdown</text>
  <text x="1112" y="349" class="body">Baseline · E1–E4 · explanation</text>
  <text x="1112" y="377" class="body">SUSPICIOUS or</text>
  <text x="1112" y="398" class="body">INSUFFICIENT_EVIDENCE</text>

  <path d="M300 170 C335 170 340 272 380 272" class="line"/>
  <path d="M300 170 C335 170 345 542 380 542" class="line"/>
  <path d="M300 345 C340 345 340 142 380 142" class="line"/>
  <path d="M300 545 C340 545 340 407 380 407" class="mutedline"/>
  <path d="M645 142 C680 142 680 275 720 275" class="line"/>
  <path d="M645 272 C680 272 680 310 720 310" class="line"/>
  <path d="M645 407 C680 407 680 365 720 365" class="mutedline"/>
  <path d="M645 542 C680 542 680 420 720 420" class="line"/>
  <path d="M1020 340 L1090 340" class="line"/>
  <text x="40" y="650" class="subtitle">ANOMALY ≠ FAULT · E3 remains decision-ineligible while independent provenance and event adjudication are insufficient.</text>
</svg>
